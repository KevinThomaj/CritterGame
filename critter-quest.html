<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Critter Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#221d2e;--panel:#fffaf0;--panel2:#f1e6cf;--edge:#1a1524;--accent:#e2574c;--gold:#e0a020}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 50% 0,#3a2f55,#16121f 70%);color:var(--ink);font:16px/1.35 'Fredoka',system-ui,sans-serif;display:flex;justify-content:center;align-items:flex-start;min-height:100vh;padding:16px}
#wrap{position:relative;width:min(960px,100%);aspect-ratio:3/2;border-radius:14px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.55),0 0 0 4px #2a2433;background:#000}
canvas#world{width:100%;height:100%;display:block}
.hidden{display:none!important}
button{font:inherit;font-weight:600;border:3px solid var(--edge);border-radius:10px;background:linear-gradient(#fff,#f1e6cf);cursor:pointer;padding:6px 10px;color:var(--ink);box-shadow:0 3px 0 rgba(0,0,0,.25);transition:transform .08s}
button:hover:not(:disabled){transform:translateY(-1px);background:linear-gradient(#fff,#ffe3b0)}
button:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
button:disabled{opacity:.45;cursor:default}
button small{display:block;font-weight:500;font-size:11px;opacity:.8}
/* HUD */
#hud{position:absolute;left:10px;bottom:10px;display:flex;flex-direction:column;gap:5px;pointer-events:none;align-items:flex-start;max-width:70%}
.chip{background:rgba(255,250,240,.94);border:3px solid var(--edge);border-radius:10px;padding:3px 10px;font-weight:600;font-size:13px;box-shadow:0 3px 0 rgba(0,0,0,.3)}
#mute{position:absolute;top:10px;right:10px;width:40px;height:40px;padding:0;font-size:18px;z-index:8}
#banner{position:absolute;top:18px;left:50%;transform:translate(-50%,-90px);background:linear-gradient(#fffaf0,#f1e6cf);border:3px solid var(--edge);border-radius:12px;padding:6px 26px;font-weight:700;font-size:22px;transition:transform .45s cubic-bezier(.2,1.4,.4,1);box-shadow:0 4px 0 rgba(0,0,0,.3);z-index:3;white-space:nowrap}
#banner.on{transform:translate(-50%,0)}
#banner small{display:block;text-align:center;font-size:12px;font-weight:500;opacity:.7}
#toast{position:absolute;left:50%;top:76px;transform:translateX(-50%);background:var(--panel);border:3px solid var(--edge);border-radius:10px;padding:6px 14px;font-weight:600;opacity:0;transition:opacity .3s;pointer-events:none;z-index:9;text-align:center;max-width:90%}
#toast.on{opacity:1}
/* dialog */
.choices{display:flex;flex-direction:column;gap:6px;margin-top:10px}.choices button{font:inherit;font-size:16px;text-align:left;padding:5px 12px;border:3px solid var(--edge);border-radius:10px;background:#fff;cursor:pointer;color:inherit}.choices button.on{background:#ffe680;transform:translateX(4px)}.choices b{display:inline-block;width:22px;color:#a07020}
#dlg{position:absolute;left:12px;right:12px;bottom:12px;background:linear-gradient(#fffaf0,#f6ecd8);border:4px solid var(--edge);border-radius:14px;padding:12px 16px 22px;font-size:19px;font-weight:500;min-height:110px;cursor:pointer;z-index:5;display:flex;gap:14px;align-items:flex-start;box-shadow:0 6px 0 rgba(0,0,0,.35)}
#portrait{width:84px;height:84px;border:3px solid var(--edge);border-radius:12px;background:linear-gradient(#bfe6ff,#e8f6ff);flex:none}
#dname{display:inline-block;background:var(--edge);color:#fff;font-size:13px;font-weight:600;border-radius:6px;padding:1px 8px;margin-bottom:4px}
#dlg:after{content:'▼';position:absolute;right:14px;bottom:6px;font-size:12px;animation:blink 1s infinite}
@keyframes blink{50%{opacity:0}}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .22s;z-index:7}
/* overlays */
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden}
#battle{background:#000;z-index:4}
#battle .field{position:relative;flex:none}
#scene{width:100%;display:block;aspect-ratio:960/440}
.card{position:absolute;background:linear-gradient(#fffaf0,#f1e6cf);border:3px solid var(--edge);border-radius:12px;padding:6px 12px 7px;min-width:36%;box-shadow:0 4px 0 rgba(0,0,0,.3);transition:opacity .3s}
#foeCard{left:3%;top:6%}
#myCard{right:3%;bottom:5%}
.cn{display:flex;justify-content:space-between;font-weight:700;font-size:17px;gap:10px}
.meta{display:flex;gap:5px;align-items:center;margin-top:1px;flex-wrap:wrap}
.badge{font-size:11px;color:#fff;border-radius:999px;padding:0 8px;font-weight:600;text-shadow:0 1px 0 rgba(0,0,0,.3)}
.stars{color:var(--gold);font-size:12px;letter-spacing:-1px;text-shadow:0 1px 0 #7a5a10}
.grade{border-radius:5px;padding:0 6px;font-size:11px;font-weight:700;color:#fff;background:#6a6a7a}
.grade.gS{background:linear-gradient(#ffcf3a,#e08a10)}.grade.gA{background:#a04be0}.grade.gB{background:#2f86e6}.grade.gC{background:#7a7a8a}
.prism{color:#ff6ac0;font-size:13px;text-shadow:0 0 6px #ff9ae0}
.bar{height:12px;background:#3a3344;border-radius:6px;overflow:hidden;border:2px solid var(--edge);margin-top:4px}
.bar>div{height:100%;background:linear-gradient(#8ef09a,#3fae4f);transition:width .6s ease;box-shadow:inset 0 2px 0 rgba(255,255,255,.35)}
.bar.low>div{background:linear-gradient(#ffe07a,#e8a020)}.bar.crit>div{background:linear-gradient(#ff9a8a,#d83a2a)}
.bar.xp{height:7px;margin-top:3px}.bar.xp>div{background:linear-gradient(#8ac8ff,#3a7ae0)}
.hpt{font-size:12px;text-align:right;font-weight:600;margin-top:1px}
.dots{display:flex;gap:4px;margin-top:4px}.dots i{width:10px;height:10px;border-radius:50%;background:#bbb;border:2px solid var(--edge)}.dots i.on{background:#4fd8c4}
#lvPanel{position:absolute;right:3%;bottom:36%;background:linear-gradient(#fffaf0,#f1e6cf);border:3px solid var(--edge);border-radius:12px;padding:8px 14px;font-weight:600;min-width:200px;box-shadow:0 4px 0 rgba(0,0,0,.3)}
#lvPanel h4{margin:0 0 4px;font-size:16px}
#lvPanel div{display:flex;justify-content:space-between;gap:16px;font-size:14px}
#lvPanel b{color:#2f9a3f}
#panel{flex:1;display:grid;grid-template-columns:1.05fr 1fr;background:linear-gradient(#3a3050,#241d33);padding:8px;gap:8px;min-height:0}
#log{background:linear-gradient(#fffaf0,#f6ecd8);border-radius:12px;border:3px solid var(--edge);padding:10px 14px;font-size:18px;font-weight:600;overflow:hidden}
#actions{display:grid;grid-template-columns:1fr 1fr;gap:6px;overflow:auto;align-content:start}
#actions button{padding:4px 6px;font-size:15px;min-height:46px}
#actions .fight{background:linear-gradient(#ffb0a0,#ff7a6a)}#actions .bag{background:linear-gradient(#ffe7a0,#ffc94a)}
#actions .team{background:linear-gradient(#b8f0b0,#6fd06a)}#actions .run{background:linear-gradient(#b0d8ff,#6aaaff)}
/* menus */
#menu,#evo{background:linear-gradient(#fffaf0,#efe2c6);z-index:6}
.mhead{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:4px solid var(--edge);background:linear-gradient(#4a3d66,#2e2444)}
.mhead h2{color:#fff;margin:0;font-size:22px;flex:1}
.tabs{display:flex;gap:6px;flex:1;flex-wrap:wrap}
.tab.on{background:linear-gradient(#ffe3a0,#ffc94a)}
.x{margin-left:auto}
.coins{color:#ffe07a;font-weight:700;font-size:18px}
.mbody{flex:1;overflow:auto;padding:12px}
.row{display:flex;align-items:center;gap:10px;border:3px solid var(--edge);border-radius:12px;padding:6px 8px;margin:0 0 8px;background:#fff;box-shadow:0 3px 0 rgba(0,0,0,.15)}
.row canvas{width:76px;height:76px;flex:none;background:radial-gradient(circle,#eaf6ff,#cfe6f5);border-radius:10px;border:2px solid var(--edge)}
.row .grow{flex:1;min-width:0}
.rn{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.rn b{font-size:17px}
.lv{font-weight:700;color:#6a4bb0}
.sm{font-size:12.5px}.muted{opacity:.65}
.moves{display:flex;gap:4px;flex-wrap:wrap;margin:3px 0}.moves span{font-size:11px;color:#fff;border-radius:6px;padding:1px 7px;font-weight:600}
.btns{display:flex;flex-direction:column;gap:4px}.btns button{padding:3px 8px;font-size:12px}
.leadtag{font-weight:700;color:#e2574c;text-align:center;font-size:13px}
.dex{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.dex .d{border:3px solid var(--edge);border-radius:12px;background:#fff;text-align:center;font-size:12px;font-weight:600;padding:4px;cursor:pointer}
.dex .d:hover{background:#fff4dc}.dex canvas{width:80px;height:80px}
.dexd{display:flex;gap:14px;border:3px solid var(--edge);border-radius:12px;background:#fff;padding:10px;margin-bottom:12px;flex-wrap:wrap}
.dexd canvas{width:170px;height:170px;background:radial-gradient(circle,#eaf6ff,#cfe6f5);border-radius:12px;border:2px solid var(--edge)}
.stat{display:flex;align-items:center;gap:6px;font-size:12px}.stat span{width:34px}.stat i{height:8px;border-radius:4px;background:#4a8cff;display:block}
.icon{font-size:30px;width:50px;text-align:center}
.price{font-weight:700;color:#a07010;margin-right:6px}
.tcard{display:flex;gap:16px;border:3px solid var(--edge);border-radius:14px;background:linear-gradient(135deg,#fff,#f6ecd8);padding:14px;flex-wrap:wrap}
.tcard canvas{width:120px;height:120px;border:3px solid var(--edge);border-radius:12px;background:linear-gradient(#bfe6ff,#e8f6ff)}
.sigils{display:flex;gap:8px;margin-top:8px}.sig{width:52px;height:52px;border-radius:50%;border:3px solid var(--edge);display:flex;align-items:center;justify-content:center;font-size:24px;background:#ddd;filter:grayscale(1);opacity:.4}
.sig.on{filter:none;opacity:1;background:radial-gradient(circle,#fff6c0,#ffc94a);box-shadow:0 0 12px #ffd76a}
/* start / title */
#start{z-index:6}
#titleCv{position:absolute;inset:0;width:100%;height:100%}
#startBox{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;text-align:center;overflow:auto}
.logo{font-size:64px;font-weight:700;color:#fff;letter-spacing:1px;text-shadow:0 4px 0 #2a2433,0 0 0 #000,-3px -3px 0 #2a2433,3px -3px 0 #2a2433,-3px 3px 0 #2a2433,3px 3px 0 #2a2433;line-height:1}
.sub{font-size:20px;font-weight:700;color:#ffd76a;text-shadow:0 2px 0 #2a2433;margin:6px 0 18px}
.glass{background:rgba(255,250,240,.92);border:3px solid var(--edge);border-radius:14px;padding:14px 18px;box-shadow:0 5px 0 rgba(0,0,0,.3);max-width:640px}
.starters{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px;width:100%;max-width:720px}
.starters button{padding:8px;background:rgba(255,250,240,.95)}
.starters canvas{width:100%;aspect-ratio:1}
input{font:inherit;font-size:20px;padding:6px 12px;border:3px solid var(--edge);border-radius:10px;width:220px;text-align:center}
#evo{align-items:center;justify-content:center;background:#120c1e}
#evoCv{width:min(56%,380px);aspect-ratio:1}
#evoText{color:#fff;font-size:22px;font-weight:600;text-align:center;padding:0 16px;margin-top:8px;text-shadow:0 2px 0 #000}
#pad{position:absolute;right:10px;bottom:10px;display:grid;grid-template-columns:repeat(3,46px);gap:4px;z-index:3}
#pad button{height:46px;opacity:.85;padding:0}
@media (hover:hover) and (pointer:fine){#pad{display:none}}
@media (max-width:640px){body{padding:16px 0}#log{font-size:13px}.cn{font-size:13px}#dlg{font-size:14px;min-height:80px}#portrait{width:54px;height:54px}.logo{font-size:40px}#actions button{font-size:12px;min-height:36px}.card{min-width:44%;padding:3px 8px}#hud{display:none}}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="world" width="960" height="640"></canvas>
  <div id="hud"></div>
  <button id="mute" title="Sound on/off (N)">🔊</button>
  <div id="banner"></div>
  <div id="pad">
    <button id="padMenu">☰</button><button data-d="up">▲</button><button id="padA">A</button>
    <button data-d="left">◀</button><button data-d="down">▼</button><button data-d="right">▶</button>
  </div>
  <div id="toast"></div>
  <div id="dlg" class="hidden"><canvas id="portrait" width="96" height="96"></canvas><div><span id="dname"></span><div id="dtxt"></div></div></div>

  <div id="battle" class="overlay hidden">
    <div class="field"><canvas id="scene" width="960" height="440"></canvas>
      <div class="card" id="foeCard"><div class="cn"><span id="fName"></span><span id="fLv"></span></div><div class="meta" id="fMeta"></div><div class="bar"><div id="fHp"></div></div><div class="dots" id="fDots"></div></div>
      <div class="card" id="myCard"><div class="cn"><span id="mName"></span><span id="mLv"></span></div><div class="meta" id="mMeta"></div><div class="bar"><div id="mHp"></div></div><div class="hpt" id="mHpT"></div><div class="bar xp"><div id="mXp"></div></div></div>
      <div id="lvPanel" class="hidden"></div>
    </div>
    <div id="panel"><div id="log"></div><div id="actions"></div></div>
  </div>
  <div id="evo" class="overlay hidden"><canvas id="evoCv" width="400" height="400"></canvas><div id="evoText"></div></div>
  <div id="menu" class="overlay hidden"></div>
  <div id="start" class="overlay hidden"><canvas id="titleCv" width="960" height="640"></canvas><div id="startBox"></div></div>
  <div id="fade"></div>
</div>

<script>
'use strict';
// =====================================================================
// UTILITIES
// =====================================================================
const $=id=>document.getElementById(id);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const rnd=(a,b)=>a+Math.random()*(b-a);
const TAU=Math.PI*2, OUT='#2a2433';
function hexRgb(h){h=h.replace('#','');if(h.length===3)h=[...h].map(c=>c+c).join('');const n=parseInt(h,16);return[n>>16&255,n>>8&255,n&255];}
function shade(h,a){if(!h||h[0]!=='#')return h;const[r,g,b]=hexRgb(h),f=a<0?0:255,t=Math.abs(a);return`rgb(${Math.round(r+(f-r)*t)},${Math.round(g+(f-g)*t)},${Math.round(b+(f-b)*t)})`;}
function rgba(h,a){const[r,g,b]=hexRgb(h);return`rgba(${r},${g},${b},${a})`;}
function hash(x,y,s=0){let h=Math.imul(x|0,374761393)+Math.imul(y|0,668265263)+Math.imul(s|0,1442695041);h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967296;}
function el(g,x,y,rx,ry,rot=0){g.beginPath();g.ellipse(x,y,Math.abs(rx),Math.abs(ry),rot,0,TAU);}
function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
function fs(g,fill,lw=1.8){g.fillStyle=fill;g.fill();g.lineWidth=lw;g.strokeStyle=OUT;g.stroke();}
function rg(g,x,y,r,c){const q=g.createRadialGradient(x-r*.35,y-r*.45,r*.08,x,y,r*1.2);q.addColorStop(0,shade(c,.38));q.addColorStop(.5,c);q.addColorStop(1,shade(c,-.3));return q;}

// =====================================================================
// SOUND (all synthesized with Web Audio, no files)
// =====================================================================
const SND={ctx:null,on:true,cur:null,want:null,timer:null,lastText:0,lb:0};
try{SND.on=localStorage.getItem('cq_sound')!=='off';}catch(e){}
function audioInit(){
  if(SND.ctx){if(SND.ctx.state==='suspended')SND.ctx.resume();return;}
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
  const C=new AC();SND.ctx=C;SND.master=C.createGain();SND.master.gain.value=SND.on?.55:0;SND.master.connect(C.destination);
  SND.mus=C.createGain();SND.mus.gain.value=.5;SND.mus.connect(SND.master);SND.fx=C.createGain();SND.fx.gain.value=.85;SND.fx.connect(SND.master);
  if(SND.want)playMusic(SND.want,true);
}
addEventListener('pointerdown',audioInit);addEventListener('keydown',audioInit);
function tone(f,dur,o={}){const C=SND.ctx;if(!C||!SND.on)return;const t=o.at??C.currentTime+(o.d||0);
  const os=C.createOscillator(),g=C.createGain();os.type=o.type||'square';os.frequency.setValueAtTime(f,t);if(o.to)os.frequency.exponentialRampToValueAtTime(o.to,t+dur);
  const v=o.vol??.2;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  os.connect(g);g.connect(o.dest||SND.fx);os.start(t);os.stop(t+dur+.03);}
let NOISE=null;
function noise(dur,o={}){const C=SND.ctx;if(!C||!SND.on)return;
  if(!NOISE){NOISE=C.createBuffer(1,C.sampleRate,C.sampleRate);const d=NOISE.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}
  const t=o.at??C.currentTime+(o.d||0),s=C.createBufferSource();s.buffer=NOISE;const fl=C.createBiquadFilter();fl.type=o.ft||'lowpass';fl.frequency.setValueAtTime(o.f||2000,t);
  if(o.fto)fl.frequency.exponentialRampToValueAtTime(o.fto,t+dur);const g=C.createGain();g.gain.setValueAtTime(o.vol??.3,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(fl);fl.connect(g);g.connect(o.dest||SND.fx);s.start(t);s.stop(t+dur+.03);}
const NOTE={C:0,'C#':1,D:2,'D#':3,E:4,F:5,'F#':6,G:7,'G#':8,A:9,'A#':10,B:11};
function nf(n){const m=n.match(/^([A-G]#?)(\d)$/);return 440*Math.pow(2,(NOTE[m[1]]+(+m[2]+1)*12-69)/12);}
function arp(notes,step=.07,o={}){notes.forEach((n,i)=>tone(nf(n),o.len||step*1.6,{d:i*step,type:o.type||'square',vol:o.vol??.13}));}
const SFX={
  blip:()=>tone(980,.05,{vol:.07}),
  text:()=>{const n=performance.now();if(n-SND.lastText<60)return;SND.lastText=n;tone(540+Math.random()*80,.03,{vol:.03,type:'triangle'});},
  bump:()=>{const n=performance.now();if(n-SND.lb<280)return;SND.lb=n;tone(110,.08,{type:'triangle',vol:.22});},
  cry:sp=>{const h=[...sp].reduce((a,c)=>a+c.charCodeAt(0),0),b=320+h%380;tone(b,.12,{to:b*1.5,type:'triangle',vol:.13});tone(b*1.3,.18,{d:.11,to:b*.85,type:'triangle',vol:.11});},
  door:()=>noise(.4,{f:400,fto:3000,vol:.14,ft:'bandpass'}),
  encounter:()=>{for(let i=0;i<12;i++)tone(300+i*80,.06,{d:i*.04,vol:.09});},
  alert:()=>{tone(nf('E6'),.08,{vol:.12});tone(nf('A6'),.18,{d:.08,vol:.12});},
  hit:(k=1)=>{noise(.18,{f:1800,fto:200,vol:.32*k});tone(160,.15,{to:60,vol:.16*k});},
  crit:()=>{tone(1200,.08,{vol:.1});tone(1700,.12,{d:.06,vol:.1});},
  faint:()=>tone(620,.65,{to:70,vol:.14}),
  heal:()=>arp(['C5','E5','G5','C6'],.08,{type:'triangle',vol:.16}),
  statup:()=>arp(['C5','D5','E5','G5','C6'],.05,{vol:.09}),
  levelup:()=>arp(['C5','E5','G5','C6','G5','C6','E6'],.085,{vol:.12,len:.15}),
  throw:()=>noise(.4,{f:600,fto:4000,vol:.15,ft:'bandpass'}),
  shake:()=>tone(230,.07,{type:'triangle',vol:.24}),
  caught:()=>{arp(['G4','C5','E5','G5'],.1,{vol:.12});tone(nf('C6'),.6,{d:.42,vol:.12});},
  escape:()=>{noise(.2,{f:3000,vol:.2});tone(800,.2,{to:300,vol:.09});},
  victory:()=>{const s=['C5','C5','C5','C5','G#4','A#4','C5','A#4','C5'],d=[0,.11,.22,.33,.5,.66,.82,1.02,1.12];s.forEach((n,i)=>tone(nf(n),i===8?.8:.13,{d:d[i],vol:.12}));},
  evolve:()=>{for(let i=0;i<26;i++)tone(300+i*38,.09,{d:i*.13,type:'triangle',vol:.07});},
  evolved:()=>arp(['C5','E5','G5','C6','E6','G6'],.1,{vol:.11,len:.3}),
  coin:()=>{tone(nf('B5'),.07,{vol:.11});tone(nf('E6'),.28,{d:.07,vol:.11});},
  sigil:()=>{const s=['G4','C5','E5','G5','E5','G5','C6'];s.forEach((n,i)=>tone(nf(n),i===6?1:.15,{d:i*.14,vol:.12}));},
  move:t=>({ember:()=>noise(.5,{f:900,fto:200,vol:.25}),tide:()=>noise(.55,{f:1400,fto:300,vol:.22,ft:'bandpass'}),

function playMusic(key,force){

  const M=parseTrack(s.m),Bs=parseTrack(s.b),step=60/s.bpm/2;let i=0,t=SND.ctx.currentTime+.1;
  SND.timer=setInterval(()=>{const C=SND.ctx;if(t<C.currentTime)t=C.currentTime+.05;
    while(t<C.currentTime+.35){const a=M[i%M.length],b=Bs[i%Bs.length];
      if(a)tone(a.f,a.len*step*.9,{at:t,type:s.w||'square',vol:s.w?.13:.06,dest:SND.mus});
      if(b)tone(b.f,b.len*step*.95,{at:t,type:'triangle',vol:.2,dest:SND.mus});
      if(s.drum){if(i%4===0)tone(130,.12,{at:t,to:45,type:'sine',vol:.35,dest:SND.mus});if(i%2===1)noise(.04,{at:t,f:7000,ft:'highpass',vol:.05,dest:SND.mus});}
      t+=step;i++;}},60);
}

let dlg=null;const LOOKBY={};
function talk(lines,o={}){return new Promise(res=>{
  const q=[...lines],box=$('dlg');box.classList.remove('hidden');hud();
  const show=()=>{if(!q.length){box.classList.add('hidden');dlg=null;hud();res();return;}
    const line=q.shift(),m=line.match(/^([^:]{1,22}): (.*)$/),who=m?m[1]:'',txt=m?m[2]:line,lk=LOOKBY[who];
    $('dname').textContent=who;$('dname').style.display=who?'inline-block':'none';
    if(o.critter){$('portrait').style.display='block';critPortrait($('portrait'),o.critter);}else if(lk){$('portrait').style.display='block';drawPortrait($('portrait'),lk);}else $('portrait').style.display='none';
    let i=0;const out=$('dtxt');
    dlg={typing:true,finish:()=>{clearInterval(dlg.iv);out.innerHTML=txt;dlg.typing=false;},next:show};
    dlg.iv=setInterval(()=>{i+=2;out.innerHTML=txt.slice(0,i);SFX.text();if(i>=txt.length)dlg.finish();},18);};
  show();});}
function dlgAdvance(){if(!dlg)return;if(dlg.asking){if(performance.now()-dlg.t0>250)dlg.pick(dlg.sel);return;}if(dlg.typing)dlg.finish();else dlg.next();}
$('dlg').onclick=()=>{if(dlg&&dlg.asking)return;dlgAdvance();};
function critPortrait(cv,sp){const g=cv.getContext('2d'),W=cv.width;g.clearRect(0,0,W,W);const q=g.createLinearGradient(0,0,0,W);q.addColorStop(0,'#ffe8f0');q.addColorStop(1,'#fff8fb');g.fillStyle=q;g.fillRect(0,0,W,W);drawCreature(g,sp,W/2,W*.9,W*1.15,{t:performance.now()});}
// ask(): a question with clickable / keyboard (arrows + Space, or 1-4) answers. Resolves to the chosen index.
function ask(who,q,opts){return new Promise(res=>{const box=$('dlg'),out=$('dtxt');box.classList.remove('hidden');hud();
  $('dname').textContent=who;$('dname').style.display=who?'inline-block':'none';const lk=LOOKBY[who];
  if(lk){$('portrait').style.display='block';drawPortrait($('portrait'),lk);}else $('portrait').style.display='none';
  out.innerHTML=`${q}<div class="choices">${opts.map((o,i)=>`<button data-i="${i}"><b>${i+1}</b>${o}</button>`).join('')}</div>`;
  const bs=[...out.querySelectorAll('.choices button')],upd=()=>bs.forEach((b,i)=>b.classList.toggle('on',dlg&&i===dlg.sel));
  dlg={asking:true,sel:0,t0:performance.now(),move:d=>{dlg.sel=(dlg.sel+d+opts.length)%opts.length;upd();SFX.blip();},
    pick:i=>{if(i<0||i>=opts.length)return;dlg=null;box.classList.add('hidden');out.innerHTML='';SFX.blip();hud();res(i);}};
  upd();bs.forEach((b,i)=>{b.onclick=e=>{e.stopPropagation();if(dlg&&dlg.asking)dlg.pick(i);};b.onmouseenter=()=>{if(dlg&&dlg.asking){dlg.sel=i;upd();}};});});}
async function run(fn){if(scripting)return;scripting=true;try{await fn();}finally{scripting=false;hud();save();}}

    "Professor Rho: Ahem! Today's lesson is types, ranks and grades. Then I shall test you, so pay attention!",

  const r=await battle({trainer:{name:'Pip',look:LOOK.pip,team:mt([[c,4]])},noBlackout:1,smart:.3});

async function trainerFight(n){

}

const TW=[];
function tw(obj,to,ms,ease='out'){return new Promise(res=>{const from={};for(const k in to)from[k]=obj[k]??0;TW.push({obj,from,to,start:performance.now(),ms,ease,res});});}
function stepTw(now){for(let i=TW.length-1;i>=0;i--){const t=TW[i],p=clamp((now-t.start)/t.ms,0,1),e=t.ease==='in'?p*p*p:t.ease==='lin'?p:1-Math.pow(1-p,3);for(const k in t.to)t.obj[k]=t.from[k]+(t.to[k]-t.from[k])*e;if(p>=1){TW.splice(i,1);t.res();}}}
const FX=[];
function emit(p){FX.push(Object.assign({x:0,y:0,vx:0,vy:0,gr:0,life:0,max:1,sz:6,rot:0,vr:0,delay:0,col:null,shape:'star'},p));}
function burst(x,y,shape,n,col,sp=220){for(let i=0;i<n;i++){const a=rnd(0,TAU),v=rnd(.3,1)*sp;emit({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,max:rnd(.35,.75),sz:rnd(5,11),shape,col,rot:rnd(0,6),vr:rnd(-8,8),gr:shape==='drop'||shape==='rock'?500:0});}}
function stream(A,D,shape,n,dur,cols){for(let i=0;i<n;i++)emit({x:A.x+rnd(-10,10),y:A.y+rnd(-10,10),vx:(D.x-A.x)/dur+rnd(-35,35),vy:(D.y-A.y)/dur+rnd(-35,35),max:dur,delay:i*.025,sz:rnd(8,13),shape,col:cols?cols[i%cols.length]:null,rot:rnd(0,6),vr:rnd(-10,10)});}
function arcFx(A,D,shape,n,dur){const gr=1400;for(let i=0;i<n;i++)emit({x:A.x,y:A.y,vx:(D.x-A.x)/dur+rnd(-25,25),vy:(D.y-A.y)/dur-gr*dur/2+rnd(-30,30),gr,max:dur,delay:i*.02,sz:rnd(7,11),shape});}

function stepFx(dt){for(let i=FX.length-1;i>=0;i--){const p=FX[i];if(p.delay>0){p.delay-=dt;continue;}p.life+=dt;p.vy+=p.gr*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;if(p.life>=p.max)FX.splice(i,1);}}

  g.drawImage(mapTiles(s),X,Y);
  for(let r=0;r<6;r++){const R=REG[r],rx=X+R.ox*s,ry=Y+R.oy*s,rw=MW*s,rh=MH*s;
    if(!v[r]){g.fillStyle='#2a2438';g.fillRect(rx,ry,rw,rh);g.fillStyle='rgba(255,255,255,.04)';for(let i=0;i<rw;i+=s*3)g.fillRect(rx+i,ry,s*1.5,rh);g.fillStyle='rgba(255,255,255,.35)';g.font=`700 ${big?40:14}px Fredoka,sans-serif`;g.textAlign='center';g.textBaseline='middle';g.fillText('?',rx+rw/2,ry+rh/2);}
    else if(big){g.font='700 17px Fredoka,sans-serif';g.textAlign='center';g.textBaseline='middle';const w=g.measureText(MAPS[r].name).width+18;rr(g,rx+rw/2-w/2,ry+rh-26,w,22,8);g.fillStyle='rgba(255,250,240,.88)';g.fill();g.strokeStyle=OUT;g.lineWidth=2;g.stroke();g.fillStyle='#2a2030';g.fillText(MAPS[r].name,rx+rw/2,ry+rh-14.5);}}
  g.strokeStyle='rgba(0,0,0,.45)';g.lineWidth=big?2:1;for(let r=0;r<6;r++){const R=REG[r];g.strokeRect(X+R.ox*s+.5,Y+R.oy*s+.5,MW*s-1,MH*s-1);}
  const R=REG[cur],pulse=.6+.4*Math.sin(now/300);if(big){g.strokeStyle=`rgba(255,255,255,${pulse})`;g.lineWidth=3;g.strokeRect(X+R.ox*s+1,Y+R.oy*s+1,MW*s-2,MH*s-2);}
  {const ir=big?10:7;g.font=`${big?14:10}px sans-serif`;g.textAlign='center';g.textBaseline='middle';for(const b of WORLD.bld){if(!BLDICON[b.k]||!v[regionAt(b.x,b.y)])continue;const cx=X+(b.x+b.w/2)*s,cy=Y+b.y*s-(big?.6*s:2);g.beginPath();g.arc(cx,cy,ir,0,TAU);g.fillStyle='#fff';g.fill();g.strokeStyle=OUT;g.lineWidth=1.5;g.stroke();g.fillStyle=b.k==='clinic'?'#e2574c':'#000';g.fillText(BLDICON[b.k],cx,cy+1);}}
  const gp=goalPos();if(gp){const gx=X+(gp.x+.5)*s,gy=Y+(gp.y+.5)*s,r=(big?10:5)*(1+.15*Math.sin(now/200));g.save();g.translate(gx,gy);g.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rad=i%2?r*.45:r;g.lineTo(Math.cos(a)*rad,Math.sin(a)*rad);}g.closePath();g.fillStyle='#ffd23a';g.fill();g.strokeStyle=OUT;g.lineWidth=big?2:1.2;g.stroke();g.restore();}
  const p=mapPlayer(),px=X+(p.x+.5)*s,py=Y+(p.y+.5)*s,pr=big?8:4;
  g.beginPath();g.arc(px,py,pr+3+2*pulse,0,TAU);g.fillStyle=`rgba(255,80,80,${.35*pulse})`;g.fill();
  g.beginPath();g.arc(px,py,pr,0,TAU);g.fillStyle='#ff4a4a';g.fill();g.strokeStyle='#fff';g.lineWidth=big?2.5:1.6;g.stroke();
  if(!S.loc){const[dx,dy]=DIRS[P.dir];g.beginPath();g.moveTo(px+dx*(pr+5),py+dy*(pr+5));g.lineTo(px+dx*(pr+1)-dy*pr*.7,py+dy*(pr+1)+dx*pr*.7);g.lineTo(px+dx*(pr+1)+dy*pr*.7,py+dy*(pr+1)-dx*pr*.7);g.closePath();g.fillStyle='#fff';g.fill();}}
// The small map only shows the zone you are in; the big map (Tab) shows all of Verdale.
const MINI={x:12,y:12,s:7};
function drawMinimap(now){if(mode!=='world'&&mode!=='menu')return;const g=ctx;g.setTransform(1,0,0,1,0,0);g.save();
  if(MAP.big)return drawBigMap(now),g.restore();
  const{x:X,y:Y,s}=MINI,W=MW*s,H=MH*s,mp=mapPlayer(),R=REG[S.loc?regionAt(mp.x,mp.y):S.map];
  rr(g,X-5,Y-5,W+10,H+31,10);g.fillStyle='rgba(255,250,240,.92)';g.fill();g.strokeStyle=OUT;g.lineWidth=3;g.stroke();
  g.save();rr(g,X,Y,W,H,5);g.clip();drawMapBody(g,X-R.ox*s,Y-R.oy*s,s,now,false);g.restore();
  g.font='600 14px Fredoka,sans-serif';g.textAlign='left';g.textBaseline='middle';g.fillStyle='#2a2030';
  const name=S.loc?`🏠 ${INTERIORS[S.loc].name}`:`📍 ${MAPS[S.map].name}`;g.fillText(name.length>26?name.slice(0,25)+'…':name,X+2,Y+H+13);
  g.font='600 11px Fredoka,sans-serif';g.textAlign='right';g.fillStyle='#8a7a6a';g.fillText('Tab: map',X+W,Y+H+13);g.restore();}
function drawBigMap(now){const g=ctx,s=9.6,W=WTW*s,H=WTH*s,X=(960-W)/2,Y=(640-H)/2+14;
  g.fillStyle='rgba(12,8,22,.78)';g.fillRect(0,0,960,640);
  rr(g,X-12,Y-58,W+24,H+104,16);g.fillStyle='#fffaf0';g.fill();g.strokeStyle=OUT;g.lineWidth=4;g.stroke();
  g.font='700 26px Fredoka,sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillStyle='#2a2030';g.fillText('🗺️ Map of Verdale',480,Y-30);
  g.save();rr(g,X,Y,W,H,8);g.clip();drawMapBody(g,X,Y,s,now,true);g.restore();
  g.font='600 14px Fredoka,sans-serif';g.textAlign='left';g.fillStyle='#2a2030';const ly=Y+H+24;
  const items=[['#ff4a4a','You'+(S.loc?` (in ${INTERIORS[S.loc].name})`:'')],['#ffd23a','Next goal: '+goal()]];let lx=X+6;
  for(const[c,t]of items){g.beginPath();g.arc(lx+6,ly,6,0,TAU);g.fillStyle=c;g.fill();g.strokeStyle=OUT;g.lineWidth=1.5;g.stroke();g.fillStyle='#2a2030';const tt=t.length>58?t.slice(0,57)+'…':t;g.fillText(tt,lx+16,ly);lx+=g.measureText(tt).width+40;}
  g.textAlign='right';g.fillStyle='#8a7a6a';g.fillText('✚ Clinic  ·  Tab / Esc to close',X+W-4,ly);}
function toggleMap(on){MAP.big=on??!MAP.big;held.clear();SFX.blip();$('hud').style.visibility=MAP.big?'hidden':'';}
$('world').addEventListener('click',e=>{if(mode!=='world'||scripting||dlg)return;const r=$('world').getBoundingClientRect(),x=(e.clientX-r.left)*960/r.width,y=(e.clientY-r.top)*640/r.height;
  if(MAP.big)toggleMap(false);else if(x<MINI.x+MW*MINI.s+8&&y<MINI.y+MH*MINI.s+30)toggleMap(true);});
let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;stepTw(now);stepFx(dt);
  if(mode==='world'){worldStep(dt,now);if(S.party.length)S.time+=dt;}
  if(mode==='battle')renderBattle(now);else{renderWorld(now,dt);drawMinimap(now);}
  if(!$('start').classList.contains('hidden'))renderTitle(now);
  if(mode==='evo')renderEvo(now);
  requestAnimationFrame(loop);}
setSound(SND.on);title();requestAnimationFrame(loop);
</script>
